<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skiltpugger - Lær norske bilskilt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-container">
        <header>
            <h1>Skiltpugger'n</h1>
            <p>Hvilket geografisk område eller fylke tilhører denne bokstavkombinasjonen?</p>
        </header>

        <!-- Det visuelle bilskiltet -->
        <div class="license-plate-wrapper">
            <div class="plate">
                <div class="plate-blue-strip">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Flag_of_Norway.svg" alt="Norsk flagg" class="flag-icon">
                    <span class="country-code">N</span>
                </div>
                <div class="plate-text" id="skilt-text">LA 12345</div>
            </div>
        </div>

        <!-- Brukerinput med custom autokorrekt-liste og KUN ÉN knapp -->
        <section class="input-section">
            <div class="autocomplete-wrapper">
                <input 
                    type="text" 
                    id="answer-input" 
                    placeholder="Skriv inn område eller fylke..." 
                    autocomplete="off"
                >
                <ul id="autocomplete-list" class="autocomplete-list"></ul>
            </div>
            <button onclick="checkAnswer()" class="btn-primary">Sjekk svar</button>
        </section>

        <!-- Hjelpemidler -->
        <section class="helpers-section">
            <button onclick="revealThreeOptions()" class="btn-secondary">Gi meg 3 alternativer</button>
            <button onclick="revealAnswer()" class="btn-warning">Avslør fasit</button>
            <button onclick="nextQuestion()" class="btn-next">Neste skilt ➔</button>
        </section>

        <!-- Alternativer og tilbakemelding -->
        <div id="options-container" class="options-container"></div>
        <div id="feedback" class="feedback-text"></div>
        
        <!-- Logg for de siste 5 skiltene -->
        <section class="log-section">
            <h3>Siste 5 skilt:</h3>
            <ul id="guess-log"></ul>
        </section>
		
		<!-- Legg denne til der du vil ha knappen, f.eks. under logg-seksjonen -->
		<section class="stats-button-section" style="margin-top: 1rem;">
            <button onclick="toggleStatsView()" class="btn-secondary" style="width: 100%;">Vis rå statistikk-oversikt</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
